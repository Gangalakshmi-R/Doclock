# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}


# =========================================================
# POSTGRESQL
# =========================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:doclock_rag}

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=20MB

spring.servlet.multipart.max-request-size=20MB

file.upload-dir=${FILE_UPLOAD_DIR:uploads}


# =========================================================
# EMBEDDING MODEL
# =========================================================

spring.ai.model.embedding.text=google-genai

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.embedding.text.model=gemini-embedding-001

spring.ai.google.genai.embedding.text.auto-truncate=true
# =========================================================
# GEMINI
# =========================================================

spring.ai.model.chat=google-genai

spring.ai.google.genai.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.chat.model=gemini-3.5-flash

spring.ai.google.genai.embedding.text.dimensions=384

# =========================================================
# DOCLOCK SINGLE USER AUTHENTICATION
# =========================================================

doclock.auth.username=${DOCLOCK_USERNAME:Ganga}

doclock.auth.password=${DOCLOCK_PASSWORD}

doclock.jwt.secret=${DOCLOCK_JWT_SECRET}

doclock.jwt.expiration=${DOCLOCK_JWT_EXPIRATION:86400000}

logging.level.org.springframework.security=INFO
