spring.application.name=doclock

server.port=8080


# =========================================================
# POSTGRESQL
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/doclock_rag
spring.datasource.username=postgres
spring.datasource.password=Boxer@16
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

file.upload-dir=uploads


# =========================================================
# EMBEDDING MODEL
# =========================================================

spring.ai.model.embedding=transformers

spring.ai.embedding.transformer.tokenizer.options.padding=true

# =========================================================
# GEMINI
# =========================================================

spring.ai.model.chat=google-genai




spring.ai.google.genai.chat.model=gemini-3.5-flash

